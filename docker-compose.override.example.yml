# Local development (example). Copy it as docker-compose.override.yml: docker compose loads that file
# automatically in addition to docker-compose.yml. Do not commit it. On a server, take over only the options you need
# (see the bottom), never the published ports of api, livekit and postgres.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up -d --build     # no .env, no setup script: the stack generates its own secrets
#   npm run start:studio             # http://localhost:4200, proxy as in proxy.conf.json
#
# API, LiveKit and PostgreSQL then run in containers and are reachable only on this machine (127.0.0.1);
# the frontends run with ng serve / vite and the proxy from proxy.conf.json (/api, /hubs -> 5298, /rtc -> 7880).
# The first start logs a setup code (docker compose logs api); the Regie then asks for it to create the account and
# continues with the first-run wizard (media address, address and certificate, embedding).

services:
  api:
    environment:
      # Development: cookie Secure = SameAsRequest (ng serve runs over http), detailed errors.
      ASPNETCORE_ENVIRONMENT: Development
      # Time limits and API limits of the specification (keys as in appsettings.json; durations hh:mm:ss, numbers whole):
      # PAIRING__INVITETTL: "00:02:00"
      # LIVEKIT__TOKENTTL: "00:10:00"
    ports:
      - "127.0.0.1:5298:8080"

  livekit:
    ports:
      # Signalling for ng serve / vite (/rtc). Media still goes over 7881/tcp and 7882/udp.
      - "127.0.0.1:7880:7880"

  postgres:
    ports:
      # psql, EF Core tools or a DB client on this machine.
      - "127.0.0.1:5432:5432"

  # Keep the backups in a folder of the host (uncomment):
  # backup:
  #   volumes:
  #     # Keep the backups in a folder of the host instead of the volume "backups" (restore reads them from there as well).
  #     - ./backups:/backups
