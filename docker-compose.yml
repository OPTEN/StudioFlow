# FlowStudio stack: Caddy (TLS, frontends, reverse proxy), API (ASP.NET Core), LiveKit (SFU), PostgreSQL.
#
#   ./setup.sh            # or setup.ps1: writes .env with random secrets (never commit it)
#   docker compose up -d --build
#
# Configuration contract: docs/architecture/implementation-spec.md section 10, every variable in .env.example.
# Operations: docs/runbook.md. Published: 80/tcp, 443/tcp+udp (Caddy), 7881/tcp and 7882/udp (LiveKit media; movable
# with FLOWSTUDIO_RTC_TCP_PORT / FLOWSTUDIO_RTC_UDP_PORT).
# Required variables fail fast (${VAR:?...}); optional ones have their default here and nowhere else.

name: flowstudio

x-postgres-image: &postgres-image postgres:17.11-alpine

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - flowstudio

services:
  caddy:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    # Runs as an unprivileged user without capabilities; binding 80/443 needs only this (namespaced) sysctl.
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FLOWSTUDIO_DOMAIN: ${FLOWSTUDIO_DOMAIN:?fehlt in .env - zuerst ./setup.sh (oder setup.ps1) ausfuehren}
      FLOWSTUDIO_EXTRA_HOSTS: ${FLOWSTUDIO_EXTRA_HOSTS:-}
      FLOWSTUDIO_DEFAULT_SNI: ${FLOWSTUDIO_DEFAULT_SNI:-${FLOWSTUDIO_DOMAIN:?fehlt in .env}}
      FLOWSTUDIO_TLS_MODE: ${FLOWSTUDIO_TLS_MODE:?fehlt in .env (internal, acme, custom oder dns-<anbieter>)}
      FLOWSTUDIO_ACME_EMAIL: ${FLOWSTUDIO_ACME_EMAIL:-}
      FLOWSTUDIO_DNS_RESOLVERS: ${FLOWSTUDIO_DNS_RESOLVERS:-1.1.1.1 9.9.9.9}
      FLOWSTUDIO_DNS_CHALLENGE_DOMAIN: ${FLOWSTUDIO_DNS_CHALLENGE_DOMAIN:-_acme-challenge.${FLOWSTUDIO_DOMAIN:?fehlt in .env}}
      FLOWSTUDIO_FRAME_ANCESTORS: ${FLOWSTUDIO_FRAME_ANCESTORS:-}
      FLOWSTUDIO_HSTS_MAX_AGE: ${FLOWSTUDIO_HSTS_MAX_AGE:-31536000}
      FLOWSTUDIO_TRUSTED_PROXIES: ${FLOWSTUDIO_TRUSTED_PROXIES:-127.0.0.1/32}
      FLOWSTUDIO_MAX_UPLOAD: ${FLOWSTUDIO_MAX_UPLOAD:-1100MiB}
      FLOWSTUDIO_MAX_BODY: ${FLOWSTUDIO_MAX_BODY:-10MB}
      # DNS provider credentials; only the ones of the selected dns-* mode are read.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      INFOMANIAK_API_TOKEN: ${INFOMANIAK_API_TOKEN:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      DESEC_TOKEN: ${DESEC_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      GANDI_BEARER_TOKEN: ${GANDI_BEARER_TOKEN:-}
      OVH_ENDPOINT: ${OVH_ENDPOINT:-}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
    volumes:
      # Certificates, ACME account and (internal mode) the local CA: must survive every restart and update.
      - caddy_data:/data
      - caddy_config:/config
    # healthcheck: from the image (loopback listener 127.0.0.1:2020/healthz, see infra/caddy/Dockerfile)
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy

  api:
    <<: *service-defaults
    build:
      context: apps/api
    cap_drop:
      - ALL
    environment:
      FLOWSTUDIO__PUBLICBASEURL: ${FLOWSTUDIO_PUBLIC_BASE_URL:-https://${FLOWSTUDIO_DOMAIN:?fehlt in .env}}
      # The effective list Caddy enforces for /o/ (shown read-only in the Regie).
      FLOWSTUDIO__FRAMEANCESTORS: "'self'${FLOWSTUDIO_FRAME_ANCESTORS:+ $FLOWSTUDIO_FRAME_ANCESTORS}"
      ADMIN__USERNAME: ${ADMIN__USERNAME:?fehlt in .env}
      # One of the two must be set (the API refuses to start otherwise); setup writes the hash.
      ADMIN__PASSWORDHASH: ${ADMIN__PASSWORDHASH:-}
      ADMIN__PASSWORD: ${ADMIN__PASSWORD:-}
      LIVEKIT__APIKEY: ${LIVEKIT_API_KEY:?fehlt in .env}
      LIVEKIT__APISECRET: ${LIVEKIT_API_SECRET:?fehlt in .env}
      LIVEKIT__INTERNALURL: http://livekit:7880
      CONNECTIONSTRINGS__FLOWSTUDIO: Host=postgres;Database=flowstudio;Username=flowstudio;Password=${POSTGRES_PASSWORD:?fehlt in .env}
      MEDIA__PATH: /data/media
      MEDIA__MAXIMAGEBYTES: ${MEDIA__MAXIMAGEBYTES:-26214400}
      MEDIA__MAXVIDEOBYTES: ${MEDIA__MAXVIDEOBYTES:-1073741824}
      DATAPROTECTION__KEYSPATH: /data/keys
      # Only Caddy (inside this network) may set X-Forwarded-For / -Proto.
      FORWARDEDHEADERS__KNOWNNETWORKS__0: ${FLOWSTUDIO_SUBNET:-172.30.0.0/24}
    volumes:
      - media:/data/media
      # ASP.NET Core Data Protection keys: logins survive restarts and updates.
      - keys:/data/keys
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy

  livekit:
    <<: *service-defaults
    image: livekit/livekit-server:v1.13.10
    cap_drop:
      - ALL
    # Media goes directly to the clients, never through Caddy. Signalling (7880) is only reachable via Caddy (/rtc).
    # Host and container port must be the same number: LiveKit announces the container-side port to the devices.
    ports:
      - "${FLOWSTUDIO_RTC_TCP_PORT:-7881}:${FLOWSTUDIO_RTC_TCP_PORT:-7881}/tcp"
      - "${FLOWSTUDIO_RTC_UDP_PORT:-7882}:${FLOWSTUDIO_RTC_UDP_PORT:-7882}/udp"
    environment:
      # The address LiveKit announces to the devices: the server's LAN IPv4 (127.0.0.1 only for single-machine tests).
      NODE_IP: ${FLOWSTUDIO_NODE_IP:?fehlt in .env (LAN-IPv4 des Servers)}
      # YAML "key: secret" - the secret starts with a letter (an all-digit value would be parsed as a number).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?fehlt in .env}: ${LIVEKIT_API_SECRET:?fehlt in .env}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${FLOWSTUDIO_RTC_TCP_PORT:-7881}
          udp_port: ${FLOWSTUDIO_RTC_UDP_PORT:-7882}
          use_external_ip: false
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20
        logging:
          level: info
        webhook:
          api_key: ${LIVEKIT_API_KEY:?fehlt in .env}
          urls:
            - http://api:8080/api/livekit/webhook
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  postgres:
    <<: *service-defaults
    image: *postgres-image
    environment:
      POSTGRES_DB: flowstudio
      POSTGRES_USER: flowstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fehlt in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TCP, not the socket: during the first initialisation the server listens only on the socket.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "flowstudio", "-d", "flowstudio"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    # Time for a clean shutdown (otherwise Docker kills it after 10 s and the next start runs crash recovery).
    stop_grace_period: 30s

  # Network impairment for tests: docker compose --profile chaos run --rm netem apply 100 10 0
  # Shares LiveKit's network namespace, so it affects media, signalling and the API <-> LiveKit traffic.
  netem:
    build: infra/netem
    profiles: ["chaos"]
    network_mode: service:livekit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    restart: "no"

  # Helper for backup.sh / restore.sh: archives and restores the volumes (no network, started on demand).
  toolbox:
    image: *postgres-image
    profiles: ["tools"]
    network_mode: none
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sleep"]
    command: ["3600"]
    volumes:
      - media:/volumes/media
      - keys:/volumes/keys
      - caddy_data:/volumes/caddy_data
    restart: "no"

networks:
  flowstudio:
    ipam:
      config:
        - subnet: ${FLOWSTUDIO_SUBNET:-172.30.0.0/24}

volumes:
  caddy_data:
  caddy_config:
  media:
  keys:
  pgdata:
