# StudioFlow stack from ready-made images: Caddy (TLS, frontends, reverse proxy), API (ASP.NET Core), LiveKit (SFU),
# PostgreSQL, the backup service. Download this one file as docker-compose.yml and start it. Nothing else is needed:
#
#   docker compose up -d      # pulls the images (the repository is private: docker login ghcr.io first)
#
# Then open https://<server-address>:8443/ in a browser (the certificate comes from the local CA of the stack, the browser
# warns once) and finish the setup in the first-run wizard. The setup code is in the log of the API:
# docker compose logs api (or the log view of Docker Desktop / Portainer). No .env, no scripts, no secrets to invent: the
# init service generates the internal secrets once into the volume "secrets" and never again.
#
# Update:  docker compose pull && docker compose up -d      Backup:  docker compose run --rm backup backup-now
# Restore: docker compose run --rm backup restore <folder> [--verify]      (docs/runbook.md, sections 7 and 8)
#
# This file is the twin of docker-compose.yml, which builds the same images from the source (development, E2E tests, servers
# that build themselves). Only the build sections, the netem test service and the image lines differ;
# infra/release/check.mjs fails CI when the two files drift apart.
#
# The images come from GitHub Container Registry (docs/releasing.md): studioflow-web (Caddy and the three frontends),
# studioflow-api, studioflow-livekit (LiveKit with a supervisor that restarts it when the settings change) and
# studioflow-backup. STUDIOFLOW_IMAGE_TAG selects the version: latest (the default, newest release), a version such as 0.4.2,
# main (latest build of the main branch) or sha-<7 characters> (one commit); set it in an optional .env.
# STUDIOFLOW_IMAGE_REGISTRY replaces the registry path, e.g. for a mirror.
#
# Everything is optional (.env.example lists the overrides). Published ports: 8443/tcp and 8443/udp (HTTPS and HTTP/3,
# STUDIOFLOW_HTTPS_PORT), 7881/tcp and 7882/udp (media, STUDIOFLOW_RTC_TCP_PORT / STUDIOFLOW_RTC_UDP_PORT). Nothing listens
# on port 80. Address, media address, certificate, embedding and the backup schedule are set in the wizard and in the
# "Server settings" of the Regie; the API applies them to Caddy (admin API: a unix socket that only Caddy and the API mount),
# LiveKit and the backup service through shared volumes. No container has the Docker socket.
#
# Networks: "studioflow" (Caddy, API, LiveKit: what the edge needs) and "backend" (API, PostgreSQL, backup: what the data
# needs). LiveKit, the one container that takes media traffic from the internet, cannot reach PostgreSQL or the backup service.
# Configuration contract: docs/architecture/implementation-spec.md section 10. Operations: docs/runbook.md.

name: studioflow

# Group 10002 is the primary group of Caddy (uid 10001) and of the API (uid 1654, the app user of the ASP.NET image): what the
# two write for each other is readable by them and nobody else: the admin socket of Caddy (mode 660). No other container
# runs with this group or mounts that volume.

x-postgres-image: &postgres-image postgres:17.11-alpine

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - studioflow

services:
  # Runs once per start and exits: generates the internal secrets into the volume "secrets" if they are not there yet and
  # hands the shared volumes to the API (user 1654, the app user of the ASP.NET image). The secrets are never generated again
  # (the database password belongs to the data of the PostgreSQL volume), never printed and never returned by any endpoint.
  # A POSTGRES_PASSWORD, LIVEKIT_API_KEY and LIVEKIT_API_SECRET from an old .env are adopted on the first start, so an
  # installation that was set up with the old scripts keeps its database.
  init:
    image: *postgres-image
    restart: "no"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    read_only: true
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - secrets:/secrets
      - caddy_certs:/caddy-certs
      - caddy_admin:/caddy-admin
      - livekit_config:/livekit-config
      - backup_config:/backup-config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        app_uid=1654
        shared_gid=10002
        random() { tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$$1"; }
        # name, value: creates /secrets/<name> once (mode 600, owner = the API) and keeps it afterwards
        secret() {
          file="/secrets/$$1"
          if [ ! -s "$$file" ]; then
            printf '%s' "$$2" >"$$file.new"
            mv "$$file.new" "$$file"
            echo "secrets: $$1 created"
          fi
          chown "$$app_uid:$$app_uid" "$$file"
          chmod 600 "$$file"
        }
        secret postgres-password "$${POSTGRES_PASSWORD:-$$(random 32)}"
        secret livekit-api-key "$${LIVEKIT_API_KEY:-API$$(random 12)}"
        secret livekit-api-secret "$${LIVEKIT_API_SECRET:-sk$$(random 46)}"
        # Folders the API writes into; the LiveKit supervisor (root, no capabilities) writes applied.json next to livekit.yaml.
        chown "$$app_uid:$$app_uid" /caddy-certs /livekit-config /backup-config
        chmod 755 /caddy-certs /backup-config
        chmod 1777 /livekit-config
        # The folder of Caddy's admin socket belongs to the API and to the group of the two (the socket Caddy creates in it has
        # that group, mode 660).
        chown "$$app_uid:$$shared_gid" /caddy-admin
        chmod 770 /caddy-admin
        echo "secrets: ready"

  caddy:
    <<: *service-defaults
    image: ${STUDIOFLOW_IMAGE_REGISTRY:-ghcr.io/opten}/studioflow-web:${STUDIOFLOW_IMAGE_TAG:-latest}
    # Runs as an unprivileged user without capabilities; binding a port below 1024 (STUDIOFLOW_HTTPS_PORT=443) needs only
    # this (namespaced) sysctl.
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    # Host and container port are the same number: HTTP/3 advertises the port Caddy listens on. The admin API is not on any
    # network: it is the unix socket in the volume caddy_admin, which only this container and the API mount.
    user: "10001:10002"
    ports:
      - "${STUDIOFLOW_HTTPS_PORT:-8443}:${STUDIOFLOW_HTTPS_PORT:-8443}/tcp"
      - "${STUDIOFLOW_HTTPS_PORT:-8443}:${STUDIOFLOW_HTTPS_PORT:-8443}/udp"
    environment:
      STUDIOFLOW_HTTPS_PORT: ${STUDIOFLOW_HTTPS_PORT:-8443}
      STUDIOFLOW_DNS_RESOLVERS: ${STUDIOFLOW_DNS_RESOLVERS:-1.1.1.1 9.9.9.9}
      STUDIOFLOW_TRUSTED_PROXIES: ${STUDIOFLOW_TRUSTED_PROXIES:-127.0.0.1/32}
      STUDIOFLOW_MAX_UPLOAD: ${STUDIOFLOW_MAX_UPLOAD:-1100MiB}
      STUDIOFLOW_MAX_IMPORT: ${STUDIOFLOW_MAX_IMPORT:-4100MiB}
      STUDIOFLOW_MAX_BODY: ${STUDIOFLOW_MAX_BODY:-10MB}
    volumes:
      # Certificates, ACME account and the local CA: must survive every restart and update.
      - caddy_data:/data
      - caddy_config:/config
      # The uploaded certificate (server settings, mode custom); written by the API.
      - caddy_certs:/certs:ro
      # The admin socket of Caddy (global.caddy): the API pushes the configuration through it.
      - caddy_admin:/run/caddy-admin
    # healthcheck: from the image (loopback listener 127.0.0.1:2020/healthz, see infra/caddy/health.caddy)
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  api:
    <<: *service-defaults
    # The edge network (Caddy, LiveKit's webhook) and the data network (PostgreSQL).
    networks:
      - studioflow
      - backend
    user: "1654:10002"
    image: ${STUDIOFLOW_IMAGE_REGISTRY:-ghcr.io/opten}/studioflow-api:${STUDIOFLOW_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    environment:
      # How the stack is wired (Install section of the API). Address, certificate and embedding are not here: they are
      # server settings in the database (first-run wizard, "Server settings").
      INSTALL__HTTPSPORT: ${STUDIOFLOW_HTTPS_PORT:-8443}
      INSTALL__SECRETSPATH: /secrets
      INSTALL__CADDYADMINSOCKET: /run/caddy-admin/admin.sock
      INSTALL__CADDYCERTSPATH: /caddy-certs
      INSTALL__LIVEKITCONFIGPATH: /livekit-config
      INSTALL__BACKUPCONFIGPATH: /backup-config
      INSTALL__LIVEKITRTCTCPPORT: ${STUDIOFLOW_RTC_TCP_PORT:-7881}
      INSTALL__LIVEKITRTCUDPPORT: ${STUDIOFLOW_RTC_UDP_PORT:-7882}
      INSTALL__HSTSMAXAGE: ${STUDIOFLOW_HSTS_MAX_AGE:-}
      # The key pair of LiveKit and the database password are read from /secrets.
      LIVEKIT__INTERNALURL: http://livekit:7880
      CONNECTIONSTRINGS__STUDIOFLOW: Host=postgres;Database=studioflow;Username=studioflow;Application Name=studioflow-api
      MEDIA__PATH: /data/media
      MEDIA__MAXIMAGEBYTES: ${MEDIA__MAXIMAGEBYTES:-26214400}
      MEDIA__MAXVIDEOBYTES: ${MEDIA__MAXVIDEOBYTES:-1073741824}
      DATAPROTECTION__KEYSPATH: /data/keys
      # Only Caddy (inside this network) may set X-Forwarded-For / -Proto.
      FORWARDEDHEADERS__KNOWNNETWORKS__0: ${STUDIOFLOW_SUBNET:-172.30.0.0/24}
      # Readiness check of the automatic backups: reads the status file of the backup service.
      BACKUP__STATUSFILE: /data/backup-status/backup-status.json
      BACKUP__WARNAFTERHOURS: ${BACKUP_WARN_AFTER_HOURS:-48}
      # Audit log retention (runbook: What happened? View the audit log): entries and, earlier, their IP addresses are removed after this many days.
      AUDIT__RETENTIONDAYS: ${AUDIT_RETENTION_DAYS:-365}
      AUDIT__IPRETENTIONDAYS: ${AUDIT_IP_RETENTION_DAYS:-90}
    volumes:
      - media:/data/media
      # ASP.NET Core Data Protection keys: logins survive restarts and updates; they also decrypt the secrets of the settings.
      - keys:/data/keys
      # Generated once by the init service; the API only reads them.
      - secrets:/secrets:ro
      # The API writes the configuration of the other services here.
      - caddy_certs:/caddy-certs
      - caddy_admin:/run/caddy-admin
      - livekit_config:/livekit-config
      - backup_config:/backup-config
      # Only the status file of the backup service, never the backups themselves.
      - backup_status:/data/backup-status:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  livekit:
    <<: *service-defaults
    image: ${STUDIOFLOW_IMAGE_REGISTRY:-ghcr.io/opten}/studioflow-livekit:${STUDIOFLOW_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    # Media goes directly to the clients, never through Caddy. Signalling (7880) is only reachable via Caddy (/rtc).
    # Host and container port must be the same number: LiveKit announces the container-side port to the devices.
    ports:
      - "${STUDIOFLOW_RTC_TCP_PORT:-7881}:${STUDIOFLOW_RTC_TCP_PORT:-7881}/tcp"
      - "${STUDIOFLOW_RTC_UDP_PORT:-7882}:${STUDIOFLOW_RTC_UDP_PORT:-7882}/udp"
    volumes:
      # livekit.yaml (written by the API: media address, key pair) is watched by the supervisor, which restarts the server
      # when it changes; applied.json tells the API which file the running server was started with.
      - livekit_config:/lk
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      init:
        condition: service_completed_successfully

  postgres:
    <<: *service-defaults
    image: *postgres-image
    # Only the API and the backup service can reach the database.
    networks:
      - backend
    # The official entrypoint starts as root, fixes the ownership and mode of the data and socket directories
    # (CHOWN, FOWNER, DAC_OVERRIDE to enter a 0700 data directory that postgres owns) and drops to the postgres user
    # (SETUID, SETGID). The server itself runs unprivileged; nothing else is granted.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: studioflow
      POSTGRES_USER: studioflow
      # The password is set only when the data directory is first initialised; it comes from the secrets volume and stays.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    # TCP, not the socket: during the first initialisation the server listens only on the socket.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "studioflow", "-d", "studioflow"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    # Time for a clean shutdown (otherwise Docker kills it after 10 s and the next start runs crash recovery).
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  # The netem test service (profile chaos) of docker-compose.yml is not part of a release: it is built from
  # infra/netem for tests only and has no published image.

  # Backups (runbook section 7): the schedule and the off-site target come from the server settings (the API writes
  # backup-settings.json; this service reads it and follows its changes). The same image runs the commands
  #   docker compose run --rm backup backup-now
  #   docker compose run --rm backup restore <folder> [--verify]
  # Inside the stack, so the same on Linux, Windows and macOS. pg_dump connects over the network. The volumes are mounted for
  # reading and writing because restore replaces their content (CHOWN, FOWNER and DAC_OVERRIDE for the files of the other
  # users, DAC_READ_SEARCH for the Caddy volume, which only its own user may read); nothing but this service uses them.
  # The image is built on the PostgreSQL image pinned above (same major version as the server).
  backup:
    <<: *service-defaults
    # The database (backend network); the network also gives it the way out to an off-site target.
    networks:
      - backend
    image: ${STUDIOFLOW_IMAGE_REGISTRY:-ghcr.io/opten}/studioflow-backup:${STUDIOFLOW_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp
      # The PostgreSQL image declares a volume here; this one stores no data.
      - /var/lib/postgresql/data
    environment:
      PGHOST: postgres
      PGUSER: studioflow
      PGDATABASE: studioflow
      BACKUP_LIVE_POLL_SECONDS: ${BACKUP_LIVE_POLL_SECONDS:-300}
    volumes:
      # The dated backups and the incremental copy of the media (/backups/media).
      - backups:/backups
      - backup_status:/status
      - backup_config:/config:ro
      - secrets:/run/secrets:ro
      - media:/volumes/media
      - keys:/volumes/keys
      - caddy_data:/volumes/caddy_data
    healthcheck:
      test: ["CMD", "/opt/backup/healthcheck.sh"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    # A running backup is cut off after this time; the unfinished folder is removed by the next run.
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

networks:
  # Caddy, API and LiveKit.
  studioflow:
    ipam:
      config:
        - subnet: ${STUDIOFLOW_SUBNET:-172.30.0.0/24}
  # API, PostgreSQL and the backup service. LiveKit is not on it.
  backend:
    ipam:
      config:
        - subnet: ${STUDIOFLOW_BACKEND_SUBNET:-172.30.1.0/24}

volumes:
  # Generated once by the init service: database password and LiveKit key pair (mode 600). Not part of a backup; never delete
  # it without the database (the password belongs to the data of pgdata).
  secrets:
  caddy_data:
  caddy_config:
  # Shared with the API: the uploaded certificate (read by Caddy), livekit.yaml (read by the LiveKit supervisor) and the
  # settings of the backup service.
  caddy_certs:
  # The admin socket of Caddy: mounted into Caddy and the API only.
  caddy_admin:
  livekit_config:
  backup_config:
  media:
  keys:
  pgdata:
  # The dated backups, and the status file of the backup service (the API mounts only that).
  backups:
  backup_status:
