<form class="c-xfer" novalidate (submit)="submit($event)">
  <div class="c-xfer__field">
    <label class="c-xfer__label" for="duplicate-name">{{
      t('regie.transfer.duplicate.name')
    }}</label>
    <input
      id="duplicate-name"
      class="c-input"
      type="text"
      autocomplete="off"
      aria-describedby="duplicate-name-error"
      [maxlength]="nameMax"
      [formControl]="control"
      [class.is-invalid]="control.invalid && control.touched"
      [attr.aria-invalid]="control.invalid && control.touched ? 'true' : null"
    />
    @if (control.invalid && control.touched) {
      <p class="c-field-error" id="duplicate-name-error" role="alert">
        {{ t('regie.production.name.invalid', { max: nameMax }) }}
      </p>
    }
  </div>

  <p class="c-xfer__key">
    <svg sfIcon="info" aria-hidden="true"></svg>
    <span>{{ t('regie.transfer.duplicate.hint') }}</span>
  </p>
  <p class="c-hint">{{ t('regie.transfer.duplicate.details') }} {{ mediaHint() }}</p>
  @if (message(); as text) {
    <p class="c-field-error" role="alert">{{ text }}</p>
  }

  <div class="c-xfer__row">
    <button class="c-btn" type="button" [disabled]="busy()" (click)="cancelled.emit()">
      {{ t('common.cancel') }}
    </button>
    <button class="c-btn c-btn--fill" type="submit" [disabled]="busy()">
      {{ busy() ? t('regie.transfer.duplicate.busy') : t('regie.transfer.duplicate.submit') }}
    </button>
  </div>
</form>
