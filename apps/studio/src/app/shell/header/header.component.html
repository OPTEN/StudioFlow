<header class="c-header">
  <div class="c-header__brand"><svg sfIcon="mark"></svg>StudioFlow</div>
  <a
    class="c-header__sponsor"
    href="https://www.opten.ch"
    target="_blank"
    rel="noopener"
    data-testid="sponsor"
  >
    <!-- The text is the accessible name: narrow widths hide it visually only (axe label-content-name-mismatch, #79). -->
    <span class="c-header__sponsor-prefix">{{ t('regie.header.sponsor.prefix') }}&ngsp;</span>
    <svg sfIcon="opten"></svg>
    <span class="c-header__sponsor-name">OPTEN</span>
  </a>
  <sf-production-menu />

  <div class="c-header__right">
    <sf-broadcast-control />

    <div class="c-pop-wrap">
      <button
        class="c-chipbtn"
        type="button"
        aria-haspopup="dialog"
        [attr.title]="outputTitle()"
        [sfPopoverTrigger]="outputPopover"
      >
        <svg sfIcon="output"></svg>
        <span class="c-header__out-label">{{ t('regie.header.output.label') }}</span>
        @if (connectedLinks(); as names) {
          <span class="c-header__out-links">{{ names }}</span>
        }
        <span class="c-lamp" aria-hidden="true" [class]="outputLamp()"></span>
        @if (outputDropping()) {
          <span class="c-state--warn c-header__out-warn">{{
            t('regie.load.output.dropping')
          }}</span>
        }
        <span class="u-mono">{{ outputLatency() }}</span>
        @if (audioBlocked()) {
          <span class="c-state--warn" data-testid="audio-blocked">{{
            t('regie.audio.output.blocked')
          }}</span>
        }
        <svg sfIcon="chev" [size]="13"></svg>
      </button>
      @if (popovers.isOpen(outputPopover)) {
        <sf-output-popover />
      }
    </div>

    <button class="c-chipbtn" type="button" (click)="showHealth()">
      <span class="c-lamp" aria-hidden="true" [class]="healthLamp()"></span>
      <span>{{ health().text }}</span>
    </button>

    <div class="c-pop-wrap">
      <button
        class="c-ibtn"
        type="button"
        aria-haspopup="dialog"
        [attr.aria-label]="t('regie.header.layout.open')"
        [title]="t('regie.header.layout.open')"
        [sfPopoverTrigger]="layoutPopover"
      >
        <svg sfIcon="layout"></svg>
      </button>
      @if (popovers.isOpen(layoutPopover)) {
        <sf-layout-popover />
      }
    </div>

    <div class="c-pop-wrap">
      <button
        class="c-ibtn"
        type="button"
        aria-haspopup="dialog"
        [attr.aria-label]="t('regie.settings.open')"
        [title]="t('regie.settings.open')"
        [sfPopoverTrigger]="settingsPopover"
      >
        <svg sfIcon="gear"></svg>
      </button>
      @if (popovers.isOpen(settingsPopover)) {
        <sf-settings-popover />
      }
    </div>

    <span class="c-header__presence" [title]="presenceText()">
      <svg sfIcon="users"></svg>
      <span class="c-header__presence-label" aria-hidden="true">{{
        t('regie.header.presence.short', { count: operators() })
      }}</span>
      <span class="u-sr-only">{{ presenceText() }}</span>
    </span>
    <span class="c-header__clock u-mono">{{ clockText() }}</span>
  </div>
</header>
