<div class="c-monitor__head">
  <span class="c-monitor__tally" [id]="labelId"><i aria-hidden="true"></i>{{ title() }}</span>
  <span class="c-monitor__name">{{ scene()?.name }}</span>
  @if (liveEdit()) {
    <span class="c-monitor__live-edit">{{ t('regie.stage.monitor.liveEdit') }}</span>
  }
  <span class="c-monitor__meta" [class.c-monitor__meta--mono]="kind() === 'program'">{{
    meta()
  }}</span>
</div>
<div class="c-monitor__screen" #screen [style.aspect-ratio]="store.canvasAspect()">
  <sf-scene-view
    class="c-monitor__view"
    mode="monitor"
    [audioSource]="kind() === 'program'"
    [scene]="scene()"
    [label]="viewLabel()"
    [cue]="cue()"
    (transitionEnd)="onTransitionEnd()"
  />
  @if (!scene() && emptyText(); as text) {
    <span class="c-monitor__empty">{{ text }}</span>
  }
  @if (editable()) {
    <sf-edit-overlay [view]="view() ?? null" />
  }
  @if (locked()) {
    <div class="c-monitor__live-note">{{ t('regie.stage.monitor.liveNote') }}</div>
  }
</div>
