<label class="c-switch c-control-column__switch" [for]="switchId">
  <input
    type="checkbox"
    role="switch"
    [id]="switchId"
    [checked]="switcher.studioMode()"
    (change)="onStudioModeChange($event)"
  />{{ t('regie.stage.control.studioMode') }}
</label>
<span class="c-control-column__label">{{ t('regie.stage.control.transition') }}</span>
<div class="c-transition" role="group" [attr.aria-label]="t('regie.stage.control.transitionKind')">
  <button
    class="c-transition__option"
    type="button"
    [attr.aria-pressed]="switcher.transitionKind() === 'cut'"
    (click)="setKind('cut')"
  >
    {{ t('regie.stage.control.cut') }}
  </button>
  <button
    class="c-transition__option"
    type="button"
    [attr.aria-pressed]="switcher.transitionKind() === 'fade'"
    (click)="setKind('fade')"
  >
    {{ t('regie.stage.control.fade') }}
  </button>
</div>
<div
  class="c-duration"
  role="group"
  [attr.aria-label]="t('regie.stage.control.fadeDuration')"
  [class.is-off]="switcher.transitionKind() === 'cut'"
>
  <button
    class="c-duration__btn"
    type="button"
    [attr.aria-label]="t('regie.stage.control.fadeShorter')"
    [disabled]="!switcher.canStepDuration(-1)"
    (click)="step(-1)"
  >
    <svg sfIcon="minus" [size]="14"></svg>
  </button>
  <span class="c-duration__value">{{ switcher.durationLabel() }}</span>
  <button
    class="c-duration__btn"
    type="button"
    [attr.aria-label]="t('regie.stage.control.fadeLonger')"
    [disabled]="!switcher.canStepDuration(1)"
    (click)="step(1)"
  >
    <svg sfIcon="plus" [size]="14"></svg>
  </button>
</div>
@if (hasAudio()) {
  <div class="c-program-level" data-testid="program-level" [title]="t('regie.audio.program.title')">
    <span class="c-control-column__label">{{ t('regie.audio.program.label') }}</span>
    <div class="c-program-level__bar" aria-hidden="true">
      <div
        class="c-program-level__fill"
        data-testid="program-meter"
        [class.is-hot]="programHot()"
        [style.transform]="'scaleX(' + programFill() + ')'"
      ></div>
    </div>
    <span class="c-program-level__value u-mono" data-testid="program-db">{{ programText() }}</span>
  </div>
}
@if (switcher.studioMode()) {
  <button
    class="c-take"
    type="button"
    aria-keyshortcuts="Space"
    [disabled]="!switcher.canTake()"
    (click)="take()"
  >
    {{ t('regie.stage.control.take') }}
    <small class="c-take__hint">{{ t('regie.stage.control.space') }}</small>
  </button>
}
<span class="c-control-column__hint">{{ switcher.hint() }}</span>
