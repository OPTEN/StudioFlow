<sf-dock-frame dock="scenes" [count]="loading() ? null : entries().length">
  <span sfDockActions class="c-hint c-scenes-dock__keys">{{
    t('regie.scenes.dock.keysHint')
  }}</span>
  <button
    sfDockActions
    class="c-btn c-btn--sm"
    type="button"
    [attr.aria-label]="t('regie.scenes.dock.addLabel')"
    [title]="createTitle()"
    [disabled]="!commands.canCreate() || commands.blocked('scene:create')"
    (click)="create()"
  >
    <svg sfIcon="plus" [size]="14"></svg>{{ t('regie.scenes.dock.add') }}
  </button>

  @if (loading()) {
    <div class="c-empty">
      <strong>{{ t('regie.scenes.dock.loadingTitle') }}</strong
      >{{ t('regie.docks.loadingText') }}
    </div>
  } @else {
    <div class="c-scenes-dock__list">
      @for (entry of entries(); track entry.view.id) {
        <sf-scene-row [scene]="entry.scene" [view]="entry.view" (choose)="choose($event)" />
      } @empty {
        <div class="c-empty">
          <strong>{{ t('regie.scenes.dock.emptyTitle') }}</strong
          >{{ t('regie.scenes.dock.emptyText') }}
        </div>
      }
    </div>
  }
</sf-dock-frame>
