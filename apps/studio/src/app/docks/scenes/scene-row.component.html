@if (renaming()) {
  <div class="c-scene c-scene--editing">
    <span class="c-scene__thumb" aria-hidden="true" [style.aspect-ratio]="store.canvasAspect()">
      <sf-scene-thumb [scene]="scene()" />
      @if (view().key) {
        <span class="c-keycap">{{ view().key }}</span>
      }
    </span>
    <sf-inline-edit
      [label]="t('regie.scenes.row.nameLabel')"
      [value]="view().name"
      [maxLength]="maxNameLength"
      (save)="rename($event)"
      (cancel)="cancelRename()"
    />
  </div>
} @else {
  <button
    class="c-scene"
    type="button"
    data-sortable-grab
    [attr.aria-pressed]="view().pressed"
    [class.is-blocked]="blocked()"
    [attr.aria-keyshortcuts]="view().key"
    [attr.aria-label]="view().ariaLabel"
    [attr.title]="rowTitle()"
    (click)="choose.emit(view().id)"
    [sfContextMenu]="menu"
    [sfContextMenuLabel]="t('regie.scenes.row.menuLabel', { name: displayName() })"
    (keydown)="onRowKeyDown($event)"
  >
    <span class="c-scene__thumb" aria-hidden="true" [style.aspect-ratio]="store.canvasAspect()">
      <sf-scene-thumb [scene]="scene()" />
      @if (view().key) {
        <span class="c-keycap">{{ view().key }}</span>
      }
    </span>
    <span class="c-scene__text">
      <span class="c-scene__name">{{ displayName() }}</span>
      <span class="c-scene__meta">
        @if (view().isProgram) {
          <span class="c-tag c-tag--pgm">{{ t('regie.scenes.row.live') }}</span>
        } @else if (view().isPreview) {
          <span class="c-tag c-tag--pvw">{{ t('regie.scenes.row.preview') }}</span>
        }
        @if (view().health; as health) {
          <span
            class="c-lamp"
            aria-hidden="true"
            [class.is-bad]="health.bad"
            [class.is-warn]="!health.bad"
          ></span>
          <span class="c-scene__codes">{{ health.code }}</span>
          <span [class.c-state--bad]="health.bad" [class.c-state--warn]="!health.bad">{{
            t('regie.scenes.row.disrupted')
          }}</span>
        } @else {
          <span class="c-scene__codes">{{ view().codes }}</span>
        }
      </span>
    </span>
  </button>
  <button
    class="c-ibtn c-scene__more"
    type="button"
    aria-haspopup="menu"
    [attr.aria-label]="t('regie.scenes.row.menuTriggerLabel', { name: displayName() })"
    [title]="t('regie.scenes.row.menuTitle')"
    (click)="openMenuAt($event)"
  >
    <svg sfIcon="more"></svg>
  </button>
  @if (confirmOpen()) {
    <div
      #confirm
      class="c-pop c-scene__confirm"
      role="dialog"
      [attr.aria-label]="t('regie.scenes.row.deleteLabel')"
      [sfPopover]="confirmId()"
      [style.top.px]="confirmPosition().top"
      [style.left.px]="confirmPosition().left"
    >
      <sf-confirm-box
        [label]="t('regie.scenes.row.deleteLabel')"
        [confirmLabel]="t('regie.scenes.row.deleteLabel')"
        [flush]="true"
        [message]="t('regie.scenes.row.deleteMessage', { name: displayName() })"
        [busy]="deleting()"
        (confirm)="remove()"
        (cancel)="cancelDelete()"
      />
    </div>
  }
}
