<div class="c-insp">
  <div class="c-insp__row">
    <label class="c-insp__label" for="sf-insp-name">{{ t('regie.properties.scene.name') }}</label>
    <input
      class="c-input"
      id="sf-insp-name"
      type="text"
      autocomplete="off"
      spellcheck="false"
      [attr.maxlength]="maxNameLength"
      [class.is-invalid]="nameControl.invalid && nameControl.dirty"
      [formControl]="nameControl"
      (focus)="onNameFocus()"
      (blur)="onNameBlur()"
      (keydown)="onNameKeyDown($event)"
    />
  </div>

  <div class="c-insp__sub">
    {{ t('regie.properties.scene.templates') }}
    @if (autoGrid()) {
      <span class="c-insp__mode">{{ t('regie.properties.scene.autoGridActive') }}</span>
    }
  </div>
  <sf-template-picker
    [autoGridActive]="autoGrid()"
    [disabled]="disabled()"
    (pick)="applyTemplate($event)"
  />

  <div class="c-insp__row">
    <span class="c-insp__label" id="sf-insp-bg">{{ t('regie.properties.scene.background') }}</span>
    <div class="c-insp__background" role="group" aria-labelledby="sf-insp-bg">
      <input
        class="c-insp__color"
        type="color"
        [attr.aria-label]="t('regie.properties.scene.colorLabel')"
        [value]="scene().background.color"
        [disabled]="disabled()"
        (change)="setColor($event)"
      />
      <select
        class="c-select"
        [attr.aria-label]="t('regie.properties.scene.imageLabel')"
        [disabled]="disabled()"
        (change)="setBackgroundImage($event)"
      >
        <option value="" [selected]="scene().background.assetId === null">
          {{ t('regie.properties.scene.imageNone') }}
        </option>
        @if (backgroundMissing()) {
          <option [value]="scene().background.assetId" selected>
            {{ t('regie.properties.scene.imageMissing') }}
          </option>
        }
        @for (asset of imageAssets(); track asset.id) {
          <option [value]="asset.id" [selected]="asset.id === scene().background.assetId">
            {{ asset.code }} · {{ asset.name }}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="c-insp__danger">
    @if (confirming()) {
      <sf-confirm-box
        [label]="t('regie.properties.scene.delete')"
        [confirmLabel]="t('regie.properties.scene.delete')"
        [flush]="true"
        [message]="t('regie.properties.scene.deleteMessage', { name: scene().name })"
        [busy]="deleting()"
        (confirm)="deleteScene()"
        (cancel)="confirming.set(false)"
      />
    } @else {
      <span class="c-hint">{{ deleteHint() }}</span>
      <button
        class="c-btn c-btn--danger c-btn--sm"
        type="button"
        [disabled]="isLiveScene() || disabled()"
        (click)="confirming.set(true)"
      >
        {{ t('regie.properties.scene.delete') }}
      </button>
    }
  </div>
</div>
