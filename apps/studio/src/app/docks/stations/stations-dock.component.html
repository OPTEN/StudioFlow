<sf-dock-frame dock="st" [count]="loading() ? null : entries().length">
  <button
    #pairButton
    sfDockActions
    class="c-btn c-btn--sm c-btn--primary"
    type="button"
    aria-controls="sf-pairing-dock"
    [attr.aria-expanded]="layout.pairingOpen()"
    (click)="layout.togglePairing()"
  >
    <svg sfIcon="plus" [size]="14"></svg>{{ t('regie.stations.dock.pair') }}
  </button>

  @for (knock of knocks(); track knock.id) {
    <sf-knock-card [request]="knock" />
  }

  @if (loading()) {
    <div class="c-empty">
      <strong>{{ t('regie.stations.dock.loadingTitle') }}</strong
      >{{ t('regie.docks.loadingText') }}
    </div>
  } @else {
    <div class="c-st-dock__list">
      @for (entry of entries(); track entry.view.id) {
        <sf-station-row
          [device]="entry.device"
          [sources]="entry.sources"
          [view]="entry.view"
          [open]="openId() === entry.view.id"
          [pulse]="pulsing().has(entry.view.id)"
          [flash]="flashFor(entry.view.id)"
          (toggle)="toggle(entry.view.id)"
        />
      } @empty {
        <div class="c-empty">
          <strong>{{ t('regie.stations.dock.emptyTitle') }}</strong
          >{{ t('regie.stations.dock.emptyText') }}
        </div>
      }
    </div>
  }
</sf-dock-frame>
