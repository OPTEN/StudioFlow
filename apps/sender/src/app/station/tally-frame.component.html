<div
  class="c-tally"
  data-testid="tally"
  [attr.data-tally]="state()"
  [class.is-program]="state() === 'program'"
  [class.is-preview]="state() === 'preview'"
  [class.c-tally--thin]="thin()"
  [class.c-tally--compact]="compact()"
  aria-hidden="true"
>
  @if (label(); as text) {
    <span class="c-tally__badge">{{ text }}</span>
  }
</div>
<p class="u-sr-only" aria-live="assertive" aria-atomic="true">{{ spoken() }}</p>
