# Build and tests of every pull request and of main (docs/testing.md, section 6.1).
#
# The job changes decides from the changed paths which jobs run (issue 57): a docs-only change runs Prettier, the i18n
# check and the release files check and nothing else; the API runs api and contracts; the frontends and packages run
# unit-web and contracts; anything that reaches the stack (apps, packages, infra, Compose, the E2E harness, the Node
# set-up) builds the four images and runs e2e-smoke. A change to a workflow runs everything, and so does the label e2e
# on a pull request for e2e-smoke. The release commit on main (it changes .release-please-manifest.json) runs no images
# and no e2e-smoke: the release pull request ran them, and release.yml runs the smoke set against the pushed images.
# The remaining jobs run in parallel (the four image builds are one job each); e2e-smoke starts from the images that
# build-images built.
#
# Branch protection requires only the aggregate job ci-ok (and the PR title check): it fails when a job that ran failed
# or was cancelled, and passes when a job was skipped because its paths did not change. The dependency audit runs
# weekly in audit.yml. Timing budget and layout: docs/testing.md, section 6.1.
# Runners are pinned to ubuntu-24.04: ubuntu-latest is moving to a newer image, and a CI run must not change with it.
# The full run (on demand) is .github/workflows/e2e-full.yml.
#
# Every action is pinned by commit SHA (supply chain); the comment names the release.

name: CI

on:
  push:
    branches: [main]
  # Pushes to a pull request branch are built by the pull_request event; running push as well would build twice.
  # labeled: the label e2e asks for e2e-smoke on a pull request whose paths would not run it.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A new push to a pull request cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Which parts changed. The filters use predicate-quantifier every: a path counts for a filter when it matches the
  # positive pattern and none of the negated ones. On a push the base is the last green commit (step base), on a
  # pull request the merge base with its target branch.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read # the last green CI run of main (base of the diff)
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.dotnet == 'true' || steps.filter.outputs.workflows == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.workflows == 'true' }}
      code: ${{ steps.filter.outputs.code == 'true' || steps.filter.outputs.workflows == 'true' }}
      # The release commit (a push that changes .release-please-manifest.json) skips the images and e2e-smoke: the release
      # pull request ran them, and release.yml runs the smoke set against the pushed images before the version tag.
      e2e: ${{ ((steps.filter.outputs.code == 'true' || steps.filter.outputs.workflows == 'true') && !(github.event_name == 'push' && steps.filter.outputs.release == 'true')) || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    steps:
      # Full history: on a push the filter diffs against event.before, which a shallow clone does not have and cannot fetch
      # without the credentials that persist-credentials: false removes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On main the diff starts at the last commit whose CI run was green, not at the previous push: GitHub keeps one pending
      # run per concurrency group and cancels the others, so a docs-only push after a cancelled code push would otherwise
      # skip the tests of that code. Every green run then covers everything since the green run before it.
      - name: Base of the diff
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          if [ -n "$green" ] && git merge-base --is-ancestor "$green" HEAD; then base="$green"; else base="$BEFORE"; fi
          echo "Changes since ${base}."
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: every
          # code: everything that is built, tested or shipped. Docs, Markdown, the licence files, the static prototype,
          # the product site and video (pages.yml builds the site) and the Renovate configuration are not.
          filters: |
            workflows:
              - '.github/workflows/**'
            release:
              - '.release-please-manifest.json'
            api:
              - 'apps/api/**'
            dotnet:
              - 'global.json'
            web:
              - '**'
              - '!apps/api/**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!NOTICE'
              - '!prototype/**'
              - '!site/**'
              - '!video/**'
              - '!.github/**'
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!NOTICE'
              - '!prototype/**'
              - '!site/**'
              - '!video/**'
              - '!.github/renovate.json5'
              - '!.github/ISSUE_TEMPLATE/**'

  lint-typecheck:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.changes.outputs.api == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            apps/api/Directory.Packages.props
            apps/api/**/*.csproj
      - run: npm ci
      - name: Type check (packages, output page, E2E harness)
        if: needs.changes.outputs.web == 'true'
        run: npm run typecheck
      - name: Type check (product site)
        run: npm run typecheck:site
      - name: Prettier
        run: npm run format:check
      - name: i18n catalogues (index, prefixes, banned formatting)
        run: npm run check:i18n
      - name: dotnet format
        if: needs.changes.outputs.api == 'true'
        run: dotnet format apps/api/StudioFlow.slnx --verify-no-changes
      # One version in every file (release-please keeps them) and docker-compose.release.yml agrees with docker-compose.yml.
      - name: Release files
        run: node infra/release/check.mjs

  unit-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest in Node, happy-dom and jsdom: no browser needed.
      - name: Packages and output page
        run: npm run test:unit
      - name: Regie (Angular)
        run: npm run test:studio
      - name: Sender (Angular)
        run: npm run test:sender

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            apps/api/Directory.Packages.props
            apps/api/**/*.csproj
      # TreatWarningsAsErrors is set in apps/api/Directory.Build.props: a warning fails the build.
      - name: Build
        run: dotnet build apps/api/StudioFlow.slnx
      # The integration tests start PostgreSQL with Testcontainers; Docker is available on the runner.
      - name: Tests
        run: npm run test:api -- --no-build

  contracts:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            apps/api/Directory.Packages.props
            apps/api/**/*.csproj
      - run: npm ci
      - name: Generate the OpenAPI document and the TypeScript types
        run: npm run gen:contracts
      - name: Committed contract files match the code
        run: |
          git diff --exit-code -- apps/api/openapi packages/scene-model/src/generated/api.ts || {
            echo '::error::The committed contract files differ from the code. Run "npm run gen:contracts" and commit the result.'
            exit 1
          }

  # Builds the four images of docker-compose.yml that have a build section, one job each and in parallel (the slowest
  # one, not the sum, decides). The Caddy build fails on a broken Caddy configuration (it runs `caddy validate` on the
  # bootstrap config and on the shape of the config the API pushes, for every provider) and builds the three frontends;
  # the backup build fails on a broken Dockerfile or a package that has left the Alpine repository; the livekit build
  # fails on a broken wrapper around the LiveKit server. Docker layers come from the GitHub Actions cache (one scope per
  # image, shared with release.yml). All four images go to e2e-smoke as artifacts, so the stack under test is the images
  # that were validated here.
  build-images:
    name: build-images (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: apps/api
            file: apps/api/Dockerfile
            handover: true
          - image: caddy
            context: .
            file: infra/caddy/Dockerfile
            handover: true
          - image: livekit
            context: .
            file: infra/livekit/Dockerfile
            handover: true
          - image: backup
            context: .
            file: infra/backup/Dockerfile
            handover: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The backup image is built on the PostgreSQL image of docker-compose.yml, so that pg_dump matches the server.
      - name: Read the PostgreSQL pin
        id: pin
        if: matrix.image == 'backup'
        run: |
          echo "postgres_image=$(sed -n 's/^x-postgres-image: &postgres-image //p' docker-compose.yml)" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: studioflow-${{ matrix.image }}
          # api and caddy get the commit like in release.yml (version 0.1.0+1a2b3c4 in the API and the output overlay); the
          # same arguments keep the layers of this cache usable for the release build.
          build-args: ${{ matrix.image == 'backup' && format('POSTGRES_IMAGE={0}', steps.pin.outputs.postgres_image) || format('STUDIOFLOW_REVISION={0}', github.sha) }}
          # e2e-smoke checks the label after docker load: the image under test is the one this run built.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: ${{ matrix.handover && format('type=docker,dest={0}/{1}.tar', runner.temp, matrix.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Hand the image to e2e-smoke
        if: matrix.handover
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          retention-days: 1
          if-no-files-found: error

  # The smoke set (project smoke, docs/testing.md 6.2) against the real stack: Caddy, API, LiveKit, PostgreSQL and the
  # backup service, started with tests/e2e/stack.sh as numbered stack 1 without any .env: the harness drives the
  # first-run wizard (account, media address, address with the local certificate, embedding).
  e2e-smoke:
    needs: [changes, build-images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # About 10 minutes normally; the rest is room for a slow apt mirror (run 40495799429 spent 10 minutes in apt).
    timeout-minutes: 30
    env:
      E2E_STACK: 1
      # Use the images from build-images instead of building them again.
      E2E_NO_BUILD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Restore and save are separate steps: the save of actions/cache runs in a post step that a red job skips, and the
      # smoke job is red now and then; the next run would download Chromium again.
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Save the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the system libraries of Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The log prints "digest-mismatch: error" under the inputs of this step. That is the default of the action, not an
      # error: it compares the SHA-256 of the download with the one recorded at the upload and fails the step on a
      # difference. Spelled out so that the check stays on whatever the default becomes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
          digest-mismatch: error
      # Compose names the image of a service <project>-<service>; the E2E project of stack 1 is sf-e2e-1. An image counts
      # only if it was built from the commit of this run (revision label set by build-images).
      - name: Load and verify the images
        run: |
          for image in api caddy livekit backup; do
            docker load --input "$RUNNER_TEMP/images/$image.tar"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "studioflow-$image")"
            if [ "$revision" != "$GITHUB_SHA" ]; then
              echo "::error title=Wrong image::studioflow-$image was built from '$revision', not from $GITHUB_SHA."
              exit 1
            fi
            docker tag "studioflow-$image" "sf-e2e-${E2E_STACK}-$image"
          done
      # The harness generates its sample media (JPEG, WebP, MP4/H.264, WebM/VP8) with ffmpeg once and keeps them in the
      # output folder of the stack. They are cached by the hash of the generator, so ffmpeg (a slow apt install on a busy
      # mirror) is only installed when the generator changed; H-MEDIA-01 probes them in the run that makes them.
      - name: Restore the sample media
        id: samples-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/e2e/.output/sf-e2e-${{ env.E2E_STACK }}/assets
          key: e2e-samples-${{ runner.os }}-${{ hashFiles('tests/e2e/support/media-samples.ts') }}
      - name: Install ffmpeg
        if: steps.samples-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # E2E-NET-00 needs sch_netem, ifb and act_mirred in the kernel of the runner; without them the netem tests are skipped.
      - name: Load the network emulation modules
        run: tests/e2e/load-netem-modules.sh
      - name: Start the stack
        run: tests/e2e/stack.sh up "$E2E_STACK"
      - name: Run the smoke tests
        run: E2E_REUSE_STACK=1 tests/e2e/stack.sh test "$E2E_STACK" --project=smoke
      # Only after a green smoke run: H-MEDIA-01 probed the files with ffprobe, so the cache never holds a bad sample.
      - name: Save the sample media
        if: success() && steps.samples-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/e2e/.output/sf-e2e-${{ env.E2E_STACK }}/assets
          key: e2e-samples-${{ runner.os }}-${{ hashFiles('tests/e2e/support/media-samples.ts') }}
      # The harness collects the container logs (docker compose logs) in .output/<project>/logs when the run ends.
      - name: Upload the Playwright report and the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-output
          path: tests/e2e/.output
          include-hidden-files: true
          retention-days: 14

  # The one required check of branch protection (issue 57). It runs after every other job, also when they were skipped,
  # and fails when one of them failed or was cancelled. Skipped jobs pass: their paths did not change.
  ci-ok:
    needs: [changes, lint-typecheck, unit-web, api, contracts, build-images, e2e-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran is green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
