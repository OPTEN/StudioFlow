# Full E2E run: every Playwright project of tests/e2e/playwright.config.ts except soak (60 minutes, weekly, see
# docs/testing.md 6.1), against the stack built from the working tree: smoke, desktop-chromium, short-ttl, disruptive
# (restarts, lockout, network impairment with the netem sidecar, which needs NET_ADMIN on the runner), the Pixel 7,
# iPhone 15 and iPad descriptors, Firefox and WebKit.
#
# On demand only (Actions > E2E full > Run workflow): the owner removed the nightly schedule on 2026-10-27. Run it before a
# release and after larger changes. A failed run creates an issue labelled ci-failure, or adds a comment to the one that
# is still open.

name: E2E full

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      E2E_STACK: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Restore and save are separate steps: the save of actions/cache runs in a post step that a red job skips, and this
      # job is red now and then; the next run would download the three browsers again.
      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browsers and their system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Save the Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the system libraries of the browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      # The harness generates its sample media (JPEG, WebP, MP4/H.264, WebM/VP8) with ffmpeg and stops when it cannot.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The netem tests need sch_netem, ifb and act_mirred in the kernel of the runner; without them they are skipped.
      - name: Load the network emulation modules
        run: tests/e2e/load-netem-modules.sh
      # The harness builds the images with docker compose, starts the stack and removes it at the end.
      - name: Run all E2E projects
        run: >-
          tests/e2e/stack.sh test "$E2E_STACK"
          --project=smoke
          --project=desktop-chromium
          --project=i18n
          --project=short-ttl
          --project=disruptive
          --project=pixel-7
          --project=iphone-15
          --project=ipad
          --project=desktop-firefox
          --project=webkit
      # Image scan (issue 16): operating system packages and libraries of the images that were built for the run, the
      # backup image and the two third-party images. A report in the job summary; it never fails the run (exit code 0).
      - name: Install Trivy
        if: always()
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Scan the images with Trivy (report only)
        if: always()
        run: |
          postgres_image="$(sed -n 's/^x-postgres-image: &postgres-image //p' docker-compose.yml)"
          livekit_image="$(sed -n 's/^ *image: \(livekit\/livekit-server:.*\)$/\1/p' docker-compose.yml)"
          docker build --file infra/backup/Dockerfile --build-arg "POSTGRES_IMAGE=${postgres_image}" --tag studioflow-backup .
          for image in "sf-e2e-${E2E_STACK}-api" "sf-e2e-${E2E_STACK}-caddy" studioflow-backup "$postgres_image" "$livekit_image"; do
            echo "::group::Trivy $image"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output "$RUNNER_TEMP/trivy.txt" "$image" || true
            cat "$RUNNER_TEMP/trivy.txt"
            echo "::endgroup::"
            { echo "### Trivy: $image"; echo '```'; cat "$RUNNER_TEMP/trivy.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      # The harness collects the container logs (docker compose logs) in .output/<project>/logs when the run ends.
      - name: Upload the Playwright report and the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-full-output
          path: tests/e2e/.output
          include-hidden-files: true
          retention-days: 14

  report-failure:
    needs: e2e-full
    # failure() is needed: an `if` without a status function means `success() && ...`, which skips this job exactly when
    # e2e-full failed.
    if: failure() && needs.e2e-full.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that writes to the repository.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the ci-failure issue
        run: |
          gh label create ci-failure --color B60205 --description 'A scheduled CI run failed' --force
          body="The full E2E run failed.

          - Run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Trigger: ${GITHUB_EVENT_NAME}

          The Playwright report, traces and the container logs are attached to the run as artifacts."
          number="$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title 'Full E2E run failed' --label ci-failure --body "$body"
          fi
