# Performance tests: every Playwright test tagged @perf, in the project `perf` of tests/e2e/playwright.config.ts: the
# glass-to-glass latency (E2E-OUT-13, E2E-OUT-14), the many-sources test (E2E-NET-19), the output under a four times slower
# CPU (E2E-NET-20), the switching times of the Regie (E2E-SWITCH-08 and -15 [regie]) and the reference scenario against the
# performance budget (E2E-PERF-01). See docs/testing.md 2.18, 5.1 and 6.8.
#
# Manual only, and not part of the nightly run (e2e-full.yml leaves the tag out): these tests hold measurements against
# absolute thresholds and need a machine with at least 4 cores and nothing else running. The standard ubuntu-24.04 runner has
# 2 vCPU: the senders (software H.264 encoders), the stack and the browsers keep it at 93 to 100 % CPU, and the figures are not
# comparable with the thresholds (issue 39). Enter the label of a larger runner of the organisation, or of a self-hosted perf
# runner, in `runner`. On the standard runner the tests still run: they record their figures with the CPU use of the machine and
# skip what is not comparable (the report says "skipped" and why), which is useful as a trend but proves nothing.
#
# The numbers are the result, so the output folder is always uploaded: results/*.json hold every measurement, the HTML report
# the annotations (measurement, not-comparable). The tests are never retried (a second run measures a different machine).

name: Performance

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Label of the runner (at least 4 cores, nothing else running)
        required: false
        default: ubuntu-24.04
        type: string
      budget_scale:
        description: Factor for the load lines of the performance budget on a slower or faster machine (PERF_BUDGET_SCALE)
        required: false
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  perf:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      E2E_STACK: 1
      PERF_BUDGET_SCALE: ${{ inputs.budget_scale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Save the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the system libraries of the browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The harness builds the images with docker compose, starts the stack and removes it at the end. CI makes Playwright retry
      # once (retries: 1 in the config), the project `perf` sets retries to 0.
      - name: Run the performance tests
        run: tests/e2e/stack.sh test "$E2E_STACK" --project=perf
      - name: Upload the measurements, the Playwright report and the container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-output
          path: tests/e2e/.output
          include-hidden-files: true
          retention-days: 30
